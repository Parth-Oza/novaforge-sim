name: Feature proposal
description: Propose a focused simulation, sensor, planner, or interface improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What autonomy workflow or contributor need is currently difficult?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe the interface, data flow, and expected behavior.
    validations:
      required: true
  - type: textarea
    id: determinism
    attributes:
      label: Determinism and testing
      description: Explain how the feature can be replayed and tested.
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am interested in implementing this proposal.
